<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Dictionary — Phosphor</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040A13; --bg2:#071120; --line:#0F2236; --ink:#B9D3C4; --dim:#4E6B62;
  --ph:#7CFF9A; --ph2:#2BD46B; --amber:#FFB454;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:400 13px/1.55 "IBM Plex Mono",monospace;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:51;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.app{display:grid;grid-template-rows:44px 1fr;grid-template-columns:280px 1fr 480px;height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:var(--bg2)}
header h1{font-size:12px;font-weight:600;letter-spacing:.18em;color:var(--ph)}
header h1::before{content:"▮ ";animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.search{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px}
.search input{background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ph);font:inherit;width:180px;padding:4px 0;outline:0}
.search input:focus{border-color:var(--ph2)}
aside{border-right:1px solid var(--line);overflow:auto;padding:16px 0}
aside .cnt{display:flex;justify-content:space-between;padding:0 18px 14px;color:var(--dim);font-size:11px;letter-spacing:.14em}
aside .grp{padding:14px 18px 6px;color:var(--dim);font-size:10px;letter-spacing:.16em}
aside button{display:block;width:100%;text-align:left;background:0;border:0;color:var(--ink);font:inherit;padding:6px 18px;cursor:pointer;position:relative;opacity:0;animation:typein .3s forwards}
aside button::before{content:"> ";color:transparent;transition:color .15s}
aside button:hover::before,aside button.on::before{color:var(--ph)}
aside button.on{color:var(--ph);text-shadow:0 0 8px rgba(124,255,154,.6)}
aside button:hover{color:var(--ph)}
aside button:focus-visible{outline:1px solid var(--ph);outline-offset:-1px}
@keyframes typein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
main{position:relative;overflow:hidden;background:
  radial-gradient(circle at 50% 50%,rgba(43,212,107,.06),transparent 60%)}
main svg{width:100%;height:100%;display:block}
.edge{stroke:var(--line);stroke-width:1;fill:none;transition:stroke .3s}
.edge.hot{stroke:var(--ph2);stroke-dasharray:3 9;animation:flow 1.2s linear infinite;filter:url(#glow)}
@keyframes flow{to{stroke-dashoffset:-12}}
.node{cursor:pointer}
.node rect{fill:var(--bg2);stroke:var(--dim);stroke-width:1;transition:all .25s}
.node text{fill:var(--dim);font-size:9px;letter-spacing:.14em;text-anchor:middle;pointer-events:none;transition:fill .25s;font-family:"IBM Plex Mono"}
.node.near rect{stroke:var(--ph2);fill:#0A1E1A}
.node.near text{fill:var(--ink)}
.node:hover rect{stroke:var(--ph);filter:url(#glow)}
.node.sel rect{fill:var(--ph);stroke:var(--ph);filter:url(#glow);animation:pulse 2.2s ease-in-out infinite}
.node.sel text{fill:var(--ph)}
@keyframes pulse{50%{filter:url(#glow2)}}
.ring{fill:none;stroke:var(--ph);stroke-width:1;opacity:0;pointer-events:none}
.ring.go{animation:ring .9s ease-out}
@keyframes ring{0%{opacity:.8;r:8}100%{opacity:0;r:140}}
.hud{position:absolute;left:14px;bottom:12px;color:var(--dim);font-size:10px;letter-spacing:.14em}
.hud b{color:var(--ph2);font-weight:400}
section{border-left:1px solid var(--line);padding:32px 36px;overflow:auto;background:var(--bg2)}
.k{color:var(--dim);font-size:10px;letter-spacing:.16em;margin:26px 0 8px}
.k:first-child{margin-top:0}
.idx{float:right;color:var(--dim);font-size:10px;letter-spacing:.14em}
h2{font-size:38px;font-weight:300;color:var(--ph);letter-spacing:-.01em;margin:8px 0 18px;text-shadow:0 0 18px rgba(124,255,154,.35);min-height:52px}
p{color:var(--ink);font-size:14px;line-height:1.75;max-width:60ch}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel button{background:0;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:11px;padding:5px 10px;cursor:pointer;transition:all .2s;transform:translateY(6px);opacity:0;animation:up .35s forwards}
.rel button:hover{border-color:var(--ph);color:var(--ph);box-shadow:0 0 10px rgba(124,255,154,.25)}
@keyframes up{to{transform:none;opacity:1}}
.stamp{color:var(--amber);font-size:11px}
.bar{height:1px;background:linear-gradient(90deg,var(--ph2),transparent);margin:20px 0;transform-origin:left;animation:grow .6s ease-out}
@keyframes grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1100px){.app{grid-template-columns:220px 1fr 360px}}
</style>
</head>
<body>
<div class="app">
  <header><h1>AI DICTIONARY</h1><div class="search"><span>search:</span><input id="q" placeholder="_" autocomplete="off"></div></header>
  <aside id="list"></aside>
  <main>
    <svg id="g" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid slice">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="glow2" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g id="edges"></g><circle id="ring" class="ring" cx="500" cy="400" r="8"/><g id="nodes"></g>
    </svg>
    <div class="hud">NODES <b id="hn">0</b> &nbsp; EDGES <b id="he">0</b> &nbsp; FOCUS <b id="hf">—</b></div>
  </main>
  <section id="panel">
    <div class="k">TERM <span class="idx" id="idx"></span></div>
    <h2 id="title"></h2>
    <div class="k">DEFINITION</div><p id="def"></p>
    <div class="bar"></div>
    <div class="k">IN PLAIN LANGUAGE</div><p id="plain"></p>
    <div class="k">RELATES TO</div><div class="rel" id="rel"></div>
    <div class="k">LAST UPDATED</div><div class="stamp">2026-09-11 // rev 3</div>
  </section>
</div>
<script>
const T=[
["agent","Agent","Core concepts","An AI system that can observe, reason, and act toward a goal. Usually a model combined with instructions, tools, context and an execution loop.","The model in action — doing work across turns with tools and context.",["harness","tool","model","system-prompt","context-window","memory","sub-agent","tool-loop"]],
["agentic-ai","Agentic AI","Core concepts","AI systems designed to take autonomous, multi-step action rather than answer a single prompt.","AI that does things, not just says things.",["agent","autonomous-agent","workflow"]],
["autonomous-agent","Autonomous Agent","Core concepts","An agent that pursues goals with minimal human input across long horizons.","Runs on its own. You check in later.",["agent","permission-model","reflection"]],
["llm","LLM","Core concepts","A large language model: a neural network trained on text to predict and generate language.","The engine that reads and writes.",["model","foundation-model","context-window"]],
["foundation-model","Foundation Model","Core concepts","A large pre-trained model adapted to many downstream tasks.","One big base model, many uses.",["llm","model"]],
["multi-agent","Multi-Agent System","Core concepts","Several agents cooperating, competing or delegating to solve a task.","A team of agents instead of one.",["agent","sub-agent","orchestration","group-chat"]],
["model","Model","Core concepts","The trained network that maps input tokens to output tokens.","The brain, without the body.",["llm","agent","foundation-model"]],
["sub-agent","Sub-Agent","Core concepts","An agent spawned by another agent to handle a bounded sub-task.","A helper the main agent hires for one job.",["agent","multi-agent","orchestration"]],
["harness","Harness","Architecture","The runtime wrapping a model: loop, tools, permissions and state.","The scaffolding that turns a model into an agent.",["agent","tool-loop","permission-model","environment"]],
["tool","Tool","Architecture","A function the model can call to act on the world.","A thing the agent can use — search, edit, run.",["agent","tool-loop","skill"]],
["tool-loop","Tool Loop","Architecture","The repeat cycle: model proposes a tool call, runtime executes it, result returns.","Call, run, read, repeat.",["tool","harness","agent"]],
["system-prompt","System Prompt","Architecture","Standing instructions that shape the model's behaviour for a session.","The rulebook the model reads before you speak.",["agent","context-window","context-engineering"]],
["context-window","Context Window","Architecture","The maximum tokens the model can attend to at once.","The model's working desk. Finite.",["llm","memory","context-engineering","system-prompt"]],
["context-engineering","Context Engineering","Architecture","Deliberately curating what enters the context window and when.","Deciding what the model sees.",["context-window","memory","system-prompt","skill"]],
["memory","Memory","Architecture","State persisted across turns or sessions, outside the context window.","What the agent remembers tomorrow.",["agent","context-window","context-engineering"]],
["permission-model","Permission Model","Architecture","Rules for which actions require approval and which run freely.","Where the human stays in the loop.",["harness","autonomous-agent","environment"]],
["orchestration","Orchestration Layer","Architecture","The component that routes tasks among agents and tools.","The conductor.",["multi-agent","sub-agent","orchestrator-specialist","workflow"]],
["skill","Skill","Architecture","A packaged capability: instructions plus tools for a recurring task.","A reusable playbook the agent can load.",["tool","context-engineering"]],
["environment","Environment","Architecture","The sandboxed world the agent acts in: files, shell, browser.","The room the agent works in.",["harness","permission-model","computer-use"]],
["computer-use","Computer Use","Architecture","An agent operating a real computer interface through screenshots and input.","The agent moves the mouse.",["environment","tool"]],
["react","ReAct","Patterns","Interleaving reasoning traces with actions: think, act, observe.","Think out loud, then act, then look.",["chain-of-thought","tool-loop","reflection"]],
["chain-of-thought","Chain-of-Thought","Patterns","Prompting the model to reason step by step before answering.","Show your work.",["react","extended-thinking","plan-and-solve"]],
["plan-and-solve","Plan-and-Solve","Patterns","Produce an explicit plan first, then execute it step by step.","Plan, then do.",["chain-of-thought","workflow"]],
["reflection","Reflection","Patterns","The agent critiques its own output and revises.","Second draft on purpose.",["react","author-critic","autonomous-agent"]],
["orchestrator-specialist","Orchestrator / Specialist","Patterns","One agent plans and delegates; specialists execute narrow tasks.","A lead and a crew.",["orchestration","multi-agent","sub-agent"]],
["author-critic","Author / Critic","Patterns","Two roles: one produces, one evaluates and pushes back.","Writer and editor, both machines.",["reflection","multi-agent","evals"]],
["group-chat","Group Chat","Patterns","Multiple agents converse in a shared thread to reach an outcome.","Agents in a meeting.",["multi-agent","orchestration"]],
["extended-thinking","Extended Thinking","Patterns","Letting the model spend more tokens reasoning before responding.","More time to think before it speaks.",["chain-of-thought","think-tool"]],
["think-tool","Think Tool","Patterns","A no-op tool that gives the model space to reason mid-loop.","A scratchpad during work.",["extended-thinking","tool-loop"]],
["workflow","Workflow","Patterns","A predefined sequence of steps with the model as one component.","A pipeline, not a free agent.",["agentic-ai","orchestration","plan-and-solve"]],
["evals","Evals","Patterns","Systematic tests that measure agent behaviour against expectations.","How you know it works.",["author-critic","agent"]]
];
const D={};T.forEach(t=>D[t[0]]={id:t[0],name:t[1],grp:t[2],def:t[3],plain:t[4],rel:t[5]});
const neigh=id=>{const s=new Set(D[id].rel);T.forEach(t=>{if(t[5].includes(id))s.add(t[0])});s.delete(id);return[...s]};
// ---- list
const list=document.getElementById('list');
function buildList(f=''){list.innerHTML='';let i=0;
  list.insertAdjacentHTML('beforeend',`<div class="cnt"><span>TERMS</span><span>${T.length}</span></div>`);
  ['Core concepts','Architecture','Patterns'].forEach(g=>{
    const items=T.filter(t=>t[2]===g&&t[1].toLowerCase().includes(f));if(!items.length)return;
    list.insertAdjacentHTML('beforeend',`<div class="grp">${g.toUpperCase()}</div>`);
    items.forEach(t=>{const b=document.createElement('button');b.textContent=t[1];b.dataset.id=t[0];b.style.animationDelay=(i++*35)+'ms';b.onclick=()=>select(t[0]);list.appendChild(b)});
  });markList()}
function markList(){list.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===sel))}
document.getElementById('q').oninput=e=>buildList(e.target.value.toLowerCase());
// ---- graph
const NS='http://www.w3.org/2000/svg',W=1000,H=800,CX=500,CY=400;
const eg=document.getElementById('edges'),ng=document.getElementById('nodes');
const N={};let sel='agent',hot=new Set();
T.forEach((t,i)=>{const a=i/T.length*Math.PI*2;N[t[0]]={x:CX+Math.cos(a)*420,y:CY+Math.sin(a)*420,tx:CX,ty:CY,ph:Math.random()*6.28,el:null}});
const edges=[];T.forEach(t=>t[5].forEach(r=>{if(D[r]&&!edges.some(e=>(e[0]===r&&e[1]===t[0])))edges.push([t[0],r])}));
edges.forEach(e=>{const l=document.createElementNS(NS,'line');l.classList.add('edge');eg.appendChild(l);e.el=l});
T.forEach(t=>{const g=document.createElementNS(NS,'g');g.classList.add('node');
  const r=document.createElementNS(NS,'rect');r.setAttribute('width',16);r.setAttribute('height',16);r.setAttribute('x',-8);r.setAttribute('y',-8);r.setAttribute('transform','rotate(45)');
  const tx=document.createElementNS(NS,'text');tx.setAttribute('y',-16);tx.textContent=t[1].toUpperCase();
  g.append(r,tx);g.onclick=()=>select(t[0]);ng.appendChild(g);N[t[0]].el=g});
function layout(){const nb=neigh(sel);hot=new Set(nb);const others=T.map(t=>t[0]).filter(i=>i!==sel&&!hot.has(i));
  N[sel].tx=CX;N[sel].ty=CY;
  nb.forEach((id,i)=>{const a=i/nb.length*Math.PI*2-Math.PI/2;N[id].tx=CX+Math.cos(a)*230;N[id].ty=CY+Math.sin(a)*190});
  others.forEach((id,i)=>{const a=i/others.length*Math.PI*2+.3;N[id].tx=CX+Math.cos(a)*440;N[id].ty=CY+Math.sin(a)*330});
  T.forEach(t=>{const g=N[t[0]].el;g.classList.toggle('sel',t[0]===sel);g.classList.toggle('near',hot.has(t[0]));g.style.opacity=(t[0]===sel||hot.has(t[0]))?1:.35});
  edges.forEach(e=>e.el.classList.toggle('hot',e[0]===sel||e[1]===sel));
  document.getElementById('hn').textContent=T.length;document.getElementById('he').textContent=edges.length;document.getElementById('hf').textContent=D[sel].name.toUpperCase()}
let t0=0;function tick(ts){const t=ts/1000;T.forEach(x=>{const n=N[x[0]];n.x+=(n.tx-n.x)*.07;n.y+=(n.ty-n.y)*.07;
  const wob=x[0]===sel?0:4;const px=n.x+Math.sin(t*.7+n.ph)*wob,py=n.y+Math.cos(t*.9+n.ph)*wob;n.px=px;n.py=py;n.el.setAttribute('transform',`translate(${px},${py})`)});
  edges.forEach(e=>{const a=N[e[0]],b=N[e[1]];e.el.setAttribute('x1',a.px);e.el.setAttribute('y1',a.py);e.el.setAttribute('x2',b.px);e.el.setAttribute('y2',b.py)});
  requestAnimationFrame(tick)}
// ---- decode text effect
const CH='!<>-_\\/[]{}—=+*^?#░▒▓01';
function decode(el,str,speed=1){let frame=0;const len=str.length;const dur=Math.max(12,len*.6);
  (function step(){frame++;let out='';for(let i=0;i<len;i++){const p=frame/dur*len;out+=i<p?str[i]:(str[i]===' '?' ':CH[Math.random()*CH.length|0])}
   el.textContent=out;if(frame<dur)requestAnimationFrame(step);else el.textContent=str})()}
function select(id){sel=id;const d=D[id];layout();markList();
  const ring=document.getElementById('ring');ring.classList.remove('go');void ring.offsetWidth;ring.classList.add('go');
  document.getElementById('idx').textContent=`${T.findIndex(t=>t[0]===id)+1} OF ${T.length}`;
  decode(document.getElementById('title'),d.name);decode(document.getElementById('def'),d.def);
  setTimeout(()=>decode(document.getElementById('plain'),d.plain),200);
  const rel=document.getElementById('rel');rel.innerHTML='';neigh(id).forEach((r,i)=>{const b=document.createElement('button');b.textContent=D[r].name;b.style.animationDelay=(i*45+250)+'ms';b.onclick=()=>select(r);rel.appendChild(b)});
  document.querySelector('.bar').style.animation='none';void document.querySelector('.bar').offsetWidth;document.querySelector('.bar').style.animation=''}
buildList();select('agent');requestAnimationFrame(tick);
</script>
</body>
</html>
